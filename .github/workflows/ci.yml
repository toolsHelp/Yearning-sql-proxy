name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # 检查job：PR 与 main 分支 push 触发（tag push 不重复跑）
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race ./...

  release:
    # 发布job：push v* tag 触发，版本号以 tag 为准
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build artifacts
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2
            local name="sql-relay-${VERSION}-${goos}-${goarch}"
            local out="dist/${name}"
            if [ "$goos" = "windows" ]; then out="${out}.exe"; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags "-s -w" -o "$out" .
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -q "${name}.zip" "${name}.exe")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            fi
            rm -f "$out"
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          ls -l dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$VERSION" | head -1 || true)
          {
            echo "## 更新内容"
            if [ -n "$prev" ]; then
              git log --oneline "$prev..$VERSION" | sed 's/^/- /'
            else
              echo "- 首个版本"
            fi
          } > notes.md
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file notes.md
