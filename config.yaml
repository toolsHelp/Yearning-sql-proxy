# ============================================================
# sql-relay 只读 SQL 中转代理 —— 配置文件模板
# 使用前请把下面所有 <占位符> 替换成你自己的真实值。
# ============================================================

listen: 127.0.0.1:3307          # 本地 MySQL 协议监听地址（仅回环，防本机外进程直连）
server_version: "5.7.36"        # 伪装的服务端版本，促使客户端用 mysql_native_password

proxy_password: "<改成你自己的连接口令>"   # DataGrip 里 password 字段填这个口令（本地鉴权）

yearning:
  base_url: "http://<你的-yearning-后端地址>"   # Yearning 后端地址（http/https，ws/wss 自动推导）
  auth_mode: "ldap"             # ldap -> POST /ldap；general -> POST /login
  login_user: "<你的-yearning-账号>"
  login_password: "<你的-yearning-密码>"
  is_ldap: true                 # 与 Yearning /ldap 入参一致
  is_oidc: false

# 说明：DataGrip 的 user 字段直接填 Yearning 数据源名（如 gaia_purchase_order）。
# 代理会加载账号下有权限的所有数据库，按库名自动路由到对应数据源。

timeout:
  query: 120s                    # 单次查询超时
  connect: 20s                   # HTTP/WebSocket 建连超时
  metadata_cache: 5m             # information_schema 表结构元数据本地缓存 TTL

# 请求审计：抓取客户端实际发出的 SQL 及代理的处理方式，用于生成支持度矩阵。
# 默认关闭；只在需要排查「DataGrip 补全/内省为什么不全」时临时打开。
audit:
  enabled: false                 # true = 每条命令追加一行 JSON 到 path
  path: "sql-relay-audit.jsonl"  # 审计日志（JSONL），启动时追加不清空
  max_sql: 512                   # 单条 SQL 记录的最大字符数，超出截断
  keep_literals: false           # true = 保留 SQL 字面量原文（可能含业务数据）
